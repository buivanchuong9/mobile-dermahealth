<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Hành trình chăm sóc da DermaHealth</title>
  <desc id="desc">Hình ảnh 3D trừu tượng với một quỹ đạo chuyển động quanh hành trình chăm sóc da.</desc>
  <defs>
    <radialGradient id="background" cx="50%" cy="35%" r="80%">
      <stop offset="0" stop-color="#134e4a"/>
      <stop offset=".52" stop-color="#0f2929"/>
      <stop offset="1" stop-color="#071516"/>
    </radialGradient>
    <radialGradient id="orb" cx="32%" cy="24%" r="75%">
      <stop offset="0" stop-color="#ccfbf1"/>
      <stop offset=".18" stop-color="#5eead4"/>
      <stop offset=".5" stop-color="#14b8a6"/>
      <stop offset=".82" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#083344"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ccfbf1" stop-opacity=".85"/>
      <stop offset=".42" stop-color="#2dd4bf" stop-opacity=".15"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity=".85"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="30"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="7"/></filter>
    <clipPath id="orbClip"><circle cx="600" cy="248" r="118"/></clipPath>
  </defs>
  <rect width="1200" height="520" rx="28" fill="url(#background)"/>
  <ellipse cx="600" cy="420" rx="250" ry="32" fill="#2dd4bf" opacity=".18" filter="url(#blur)"/>
  <g opacity=".18" stroke="#99f6e4" stroke-width="1">
    <path d="M0 420h1200M0 465h1200M100 0v520M220 0v520M980 0v520M1100 0v520"/>
  </g>
  <g fill="none" stroke="url(#ring)" stroke-width="2">
    <ellipse cx="600" cy="248" rx="245" ry="78" transform="rotate(-18 600 248)">
      <animateTransform attributeName="transform" type="rotate" from="-18 600 248" to="342 600 248" dur="18s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="600" cy="248" rx="190" ry="56" transform="rotate(58 600 248)" opacity=".72">
      <animateTransform attributeName="transform" type="rotate" from="58 600 248" to="-302 600 248" dur="13s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="600" cy="248" rx="280" ry="105" transform="rotate(78 600 248)" opacity=".42">
      <animateTransform attributeName="transform" type="rotate" from="78 600 248" to="438 600 248" dur="26s" repeatCount="indefinite"/>
    </ellipse>
  </g>
  <circle cx="600" cy="248" r="150" fill="#2dd4bf" opacity=".12" filter="url(#glow)">
    <animate attributeName="r" values="142;158;142" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".08;.18;.08" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="248" r="118" fill="url(#orb)"/>
  <g clip-path="url(#orbClip)" fill="none" stroke="#ccfbf1" stroke-opacity=".22">
    <ellipse cx="600" cy="248" rx="130" ry="42"/>
    <ellipse cx="600" cy="248" rx="130" ry="74"/>
    <ellipse cx="600" cy="248" rx="130" ry="104"/>
    <path d="M600 125c-48 38-48 206 0 246M600 125c48 38 48 206 0 246"/>
  </g>
  <circle cx="568" cy="211" r="20" fill="#ecfeff" opacity=".55" filter="url(#glow)"/>
  <circle cx="568" cy="211" r="9" fill="#ecfeff" opacity=".9"/>
  <g font-family="Inter,Arial,sans-serif" fill="#ecfeff">
    <text x="72" y="82" font-size="14" letter-spacing="4" opacity=".72">DERMAHEALTH / HÀNH TRÌNH CHĂM SÓC DA</text>
    <text x="72" y="125" font-size="34" font-weight="700">Chăm sóc da rõ ràng hơn</text>
    <text x="72" y="155" font-size="16" opacity=".68">Từ lần đặt lịch đầu tiên đến bước tiếp theo đầy chủ động.</text>
    <text x="984" y="420" font-size="12" text-anchor="end" letter-spacing="2" opacity=".56">RÕ RÀNG · NHẸ NHÀNG · KẾT NỐI</text>
  </g>
</svg>
